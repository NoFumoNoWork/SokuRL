[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sokurl-platform"
version = "0.1.0"
description = "Research project for reinforcement-learning agents in Touhou Hisoutensoku"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["psutil==7.2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
