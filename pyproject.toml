[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hisouten-rl"
version = "0.1.0"
description = "Reinforcement-learning environment scaffolding for Touhou Hisoutensoku"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]
rl = ["gymnasium>=1.0,<2", "numpy>=1.24", "pettingzoo==1.27.0", "PyYAML>=6", "hydra-core>=1.3,<1.4"]
nfsp = ["rlcard==1.2.0", "torch>=2.2"]
psro = ["open-spiel==2.0.2", "stable-baselines3==2.9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
