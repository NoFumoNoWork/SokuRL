[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hisouten-rl"
version = "0.1.0"
description = "Research project for reinforcement-learning agents in Touhou Hisoutensoku"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["psutil==7.2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]
rl = ["gymnasium>=1.0,<2", "numpy>=1.24", "pettingzoo==1.27.0", "PyYAML>=6", "hydra-core>=1.3,<1.4"]
nfsp = ["open-spiel==2.0.2", "dm-tree>=0.1.9", "torch==2.9.1"]
ppo = ["stable-baselines3==2.9.0", "sb3-contrib==2.9.0", "torch==2.9.1"]
psro = ["open-spiel==2.0.2", "stable-baselines3==2.9.0", "cvxpy>=1.4", "matplotlib>=3.7"]
marl = ["torch==2.9.1", "torchrl==0.10.1", "tensordict==0.10.0", "benchmarl==1.5.1", "open-spiel==2.0.2", "dm-tree>=0.1.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
