[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hisouten-rl"
version = "0.1.0"
description = "Reinforcement-learning environment scaffolding for Touhou Hisoutensoku"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["psutil==7.2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]
rl = ["gymnasium>=1.0", "PyYAML>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
