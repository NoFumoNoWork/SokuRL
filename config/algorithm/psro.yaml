name: psro
iterations: 4
simulations_per_entry: 32
prd_iterations: 10000
timeout_payoff: zero_at_horizon
response:
  timesteps_per_response: 262144
  ppo:
    learning_rate: 0.0003
    n_steps: 2048
    batch_size: 256
    n_epochs: 10
    gamma: 0.999
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.01
    policy_kwargs:
      net_arch: [256, 256]
    verbose: 1
