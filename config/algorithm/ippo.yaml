name: ippo
timeout_payoff: zero_at_horizon
experiment:
  prefer_continuous_actions: false
  parallel_collection: true
  gamma: 1.0
  lr: 0.0003
  max_n_frames: 262144
  on_policy_collected_frames_per_batch: 2048
  on_policy_n_minibatch_iters: 10
  on_policy_minibatch_size: 256
  evaluation: false
  render: false
  loggers: [csv]
  create_json: true
  checkpoint_interval: 8192
  checkpoint_at_end: true
  keep_checkpoints_num: 3
ippo:
  entropy_coef: 0.01
  lmbda: 0.95
  clip_epsilon: 0.2
mlp:
  num_cells: [256, 256]
cnn:
  cnn_num_cells: [32, 64, 64]
  cnn_kernel_sizes: [8, 4, 3]
  cnn_strides: [4, 2, 1]
  cnn_paddings: [0, 0, 0]
  mlp_num_cells: [256]
