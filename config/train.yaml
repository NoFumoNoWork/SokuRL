defaults:
  - algorithm: nfsp
  - _self_

seed: 1732
device: cuda:0
num_envs: 16
episode:
  max_frames: 7200
  history_frames: 4
  decision_frames: 3
  latency_frames: 12
  observation_mode: state
  visibility:
    pixel_quantum: 8
    minimum_alpha: 0.5
    hp_quantum: 0.02
    spirit_quantum: 0.1
runtime:
  # Explicit command list. Linux: [absolute/path/run-python.sh, tools/rollout_worker.py].
  command: ???
  cwd: ${hydra:runtime.cwd}
  timeout: 300.0
  launch_timeout: 180.0
output: logs/training/${algorithm.name}-${now:%Y%m%d-%H%M%S}

hydra:
  run:
    dir: logs/hydra/train-${now:%Y%m%d-%H%M%S}
  job:
    chdir: false
