defaults:
  - train
  - override algorithm: br
  - override rules: default
  - override wrappers: learning
  - _self_

seed: 1732
num_envs: 4
device: cuda:0
episode:
  max_frames: 3600
  decision_frames: 3
  latency_frames: 0
runtime:
  command: ["${oc.env:SOKURL_PYTHON}", "${oc.env:SOKURL_PLATFORM_ROOT}/tools/rollout_worker.py"]
  cwd: ${oc.env:SOKURL_PLATFORM_ROOT}
  fresh_reset: true
  record_replays: false
  cards_disabled: true
  fixed_weather: clear
algorithm:
  player: 0
  timesteps: 32768
  checkpoint_every: 8192
  opponents:
    - name: rush
      probability: 1.0
      setup: ${episode.match.player_1}
      policy:
        kind: rule
        name: rush
        rules: ${rules}
rl:
  ppo:
    n_steps: 512
    batch_size: 256
    n_epochs: 4
    policy_kwargs:
      net_arch: [128, 128]
output: ${oc.env:SOKURL_RL_ROOT}/runs/training/platform-initial-4-${now:%Y%m%d-%H%M%S}
