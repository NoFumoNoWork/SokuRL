[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sokurl-learning"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["hydra-core>=1.3,<1.4", "gymnasium>=1.0,<2", "numpy>=1.24", "pettingzoo==1.27.0", "PyYAML>=6", "psutil==7.2.2"]

[project.optional-dependencies]
ppo = ["stable-baselines3==2.9.0", "sb3-contrib==2.9.0", "torch==2.9.1"]
god = ["lupa==2.6"]
play = ["onnxruntime==1.23.2"]
export = ["onnx==1.19.1", "onnxruntime==1.23.2"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
