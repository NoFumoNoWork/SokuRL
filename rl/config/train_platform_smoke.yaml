defaults:
  - train
  - override algorithm: br
  - override wrappers: raw
  - _self_

# Launch with ~algorithm.matchups.learner to remove the inherited sampled setup.

seed: 1732
device: cuda:0
num_envs: 4
episode:
  max_frames: 600
  decision_frames: 3
  latency_frames: 0
runtime:
  command: ["${oc.env:SOKURL_PYTHON}", "${oc.env:SOKURL_RL_ROOT}/tools/rollout_worker.py"]
  cwd: ${oc.env:SOKURL_PLATFORM_ROOT}
  fresh_reset: true
  record_replays: false
  cards_disabled: true
  fixed_weather: clear
algorithm:
  player: 0
  matchups: {mode: fixed}
  timesteps: 4096
  checkpoint_every: 1024
  opponents:
    - name: uniform
      probability: 1.0
      setup: ${episode.match.player_1}
      policy: {kind: uniform}
rl:
  cpu_threads: 4
  ppo:
    n_steps: 128
    batch_size: 128
    n_epochs: 2
    policy_kwargs:
      net_arch: [64, 64]
output: ${oc.env:SOKURL_RL_ROOT}/runs/training/platform-smoke-4-${now:%Y%m%d-%H%M%S}
