defaults:
  - train_combat_v2_credit
  - _self_

# Correctness profile, NOT an authorization for a formal training run.
# Original full Marisa Lua currently blocks on unavailable student fields.
# Do not bypass that error or treat all-masked PPO as teacher-guided training.
algorithm:
  timesteps: 256
  checkpoint_every: 256
  initial_policy:
    kind: weights
    path: ${oc.env:SOKURL_RL_ROOT}/runs/combat-v2-adaptive-20261015/campaign/train-4/final.zip
    training_config: ${oc.env:SOKURL_RL_ROOT}/runs/combat-v2-adaptive-20261015/campaign/train-4/config.yaml
rl:
  kickstarting:
    teacher:
      mode: intent
      source_adapter: th123ai_20110925
      task_context:
        fixed_weather: ${runtime.fixed_weather}
        cards_disabled: ${runtime.cards_disabled}
      package: third_party/th123_ai/package/th123ai/script
      api_source: third_party/th123_ai/source/th123_ai/api.ai
      script: 01_marisa_main.ai
      reaction_frames: 6
      instruction_limit: 1000000
      seed: 20261018
    lambda_initial: 0.1
    decay_transitions: 131072
output: ${oc.env:SOKURL_RL_ROOT}/runs/kickstarting-${now:%Y%m%d-%H%M%S}
